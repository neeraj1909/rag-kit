name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-archives:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Build wheel and source distribution
        run: uv build --no-sources
      - name: Inspect release metadata and archive contents
        run: |
          wheel=$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)
          sdist=$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)
          uv run python scripts/check_package.py \
            --wheel "$wheel" --sdist "$sdist" \
            --extra text --extra ocr --extra layout --extra vision \
            --extra media --extra persistent --extra hosted --extra http --extra reranking
      - name: Upload release archives
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-archives
          path: dist/

  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install locked development environment
        run: uv sync --frozen --group dev
      - name: Verify lockfile
        run: uv lock --check
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type-check
        run: uv run mypy src tests
      - name: Compile
        run: uv run python -m compileall -q src tests
      - name: Verify core import
        run: uv run python -c "import ragkit"
      - name: Enforce import boundaries
        run: uv run python scripts/check_imports.py
      - name: Unit tests
        run: timeout 60 uv run pytest -m unit --no-cov
      - name: Contract tests
        run: timeout 60 uv run pytest -m contract --no-cov
      - name: Integration tests
        run: timeout 60 uv run pytest -m integration --no-cov
      - name: End-to-end tests
        run: timeout 60 uv run pytest -m e2e --no-cov

  optional-extras:
    needs: release-archives
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        extra: [text, ocr, layout, vision, media, persistent, hosted, http, reranking]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-archives
          path: dist
      - name: Install one published optional boundary
        run: |
          uv venv --python ${{ matrix.python-version }} .venv-release
          wheel=$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)
          uv pip install --python .venv-release/bin/python "${wheel}[${{ matrix.extra }}]"
      - name: Import optional boundary without provider or model work
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          timeout 180 .venv-release/bin/python scripts/check_extra.py \
            --extra ${{ matrix.extra }} \
            --output reports/install/${{ matrix.python-version }}-${{ matrix.extra }}.json
      - name: Verify HTTP console entry point
        if: matrix.extra == 'http'
        run: .venv-release/bin/ragkit-http --help
      - name: Upload install-profile evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: install-${{ matrix.extra }}-python-${{ matrix.python-version }}
          path: reports/install/${{ matrix.python-version }}-${{ matrix.extra }}.json

  core-archives:
    needs: release-archives
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-archives
          path: dist
      - name: Install core wheel without optional dependencies
        run: |
          uv venv --python ${{ matrix.python-version }} .venv-wheel
          wheel=$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)
          uv pip install --python .venv-wheel/bin/python "$wheel"
      - name: Verify wheel import and missing-extra diagnostics
        run: .venv-wheel/bin/python scripts/check_core_install.py
      - name: Install source archive without optional dependencies
        run: |
          uv venv --python ${{ matrix.python-version }} .venv-sdist
          sdist=$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)
          uv pip install --python .venv-sdist/bin/python "$sdist"
      - name: Verify source-archive import and missing-extra diagnostics
        run: .venv-sdist/bin/python scripts/check_core_install.py

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install OCR system dependency
        run: sudo apt-get update -qq && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - name: Install all locked optional boundaries
        run: uv sync --frozen --group dev --all-extras
      - name: Coverage without implicit model downloads
        run: timeout 300 uv run pytest --cov=ragkit --cov-report=term-missing
      - name: Fixed-corpus benchmark (latency informational)
        run: |
          timeout 120 uv run python scripts/benchmark.py \
            --config configs/offline.toml \
            --source tests/fixtures/corpus \
            --query "What is the fixture answer?" \
            --warmups 1 --repetitions 3 \
            --output reports/benchmarks/ci-offline-text.json
          uv run python -c "from pathlib import Path; from ragkit.evaluation.benchmark import BenchmarkResult; BenchmarkResult.from_json(Path('reports/benchmarks/ci-offline-text.json').read_text())"
      - name: Upload benchmark evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase4-benchmark-python-3.12
          path: reports/benchmarks/ci-offline-text.json
