name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install locked development environment
        run: uv sync --frozen --group dev
      - name: Verify lockfile
        run: uv lock --check
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type-check
        run: uv run mypy src tests
      - name: Compile
        run: uv run python -m compileall -q src tests
      - name: Verify core import
        run: uv run python -c "import ragkit"
      - name: Enforce import boundaries
        run: uv run python scripts/check_imports.py
      - name: Unit tests
        run: timeout 60 uv run pytest -m unit --no-cov
      - name: Contract tests
        run: timeout 60 uv run pytest -m contract --no-cov
      - name: Integration tests
        run: timeout 60 uv run pytest -m integration --no-cov
      - name: End-to-end tests
        run: timeout 60 uv run pytest -m e2e --no-cov
      - name: Coverage
        run: uv run pytest --cov=ragkit --cov-report=term-missing
