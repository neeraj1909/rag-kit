name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install locked development environment
        run: uv sync --frozen --group dev
      - name: Verify lockfile
        run: uv lock --check
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type-check
        run: uv run mypy src tests
      - name: Compile
        run: uv run python -m compileall -q src tests
      - name: Verify core import
        run: uv run python -c "import ragkit"
      - name: Enforce import boundaries
        run: uv run python scripts/check_imports.py
      - name: Unit tests
        run: timeout 60 uv run pytest -m unit --no-cov
      - name: Contract tests
        run: timeout 60 uv run pytest -m contract --no-cov
      - name: Integration tests
        run: timeout 60 uv run pytest -m integration --no-cov
      - name: End-to-end tests
        run: timeout 60 uv run pytest -m e2e --no-cov
      - name: Coverage
        run: uv run pytest -m 'unit or contract' --no-cov

  optional-extras:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        extra: [ocr, layout, vision, media, persistent, hosted, reranking]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install Tesseract for OCR
        if: matrix.extra == 'ocr'
        run: sudo apt-get update -qq && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - name: Install one locked optional boundary
        run: uv sync --frozen --group dev --extra ${{ matrix.extra }}
      - name: Verify optional boundary
        run: timeout 180 uv run pytest --no-cov

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install OCR system dependency
        run: sudo apt-get update -qq && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - name: Install all locked optional boundaries
        run: uv sync --frozen --group dev --all-extras
      - name: Coverage without implicit model downloads
        run: timeout 300 uv run pytest --cov=ragkit --cov-report=term-missing
      - name: Fixed-corpus benchmark (latency informational)
        run: |
          timeout 120 uv run python scripts/benchmark.py \
            --config configs/offline.toml \
            --source tests/fixtures/corpus \
            --query "What is the fixture answer?" \
            --warmups 1 --repetitions 3 \
            --output reports/benchmarks/ci-offline-text.json
          uv run python -c "from pathlib import Path; from ragkit.evaluation.benchmark import BenchmarkResult; BenchmarkResult.from_json(Path('reports/benchmarks/ci-offline-text.json').read_text())"
      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase4-benchmark-python-3.12
          path: reports/benchmarks/ci-offline-text.json
