[profile]
name = "container-persistent"
family = "text"
source = "/data/corpus"

[components]
connector = "filesystem"
classifier = "text"
extractor = "text"
projector = "noop"
chunker = "adaptive"
embedder = "hashing"
vector_store = "sqlite"
retriever = "dense"
reranker = "noop"
prompt_builder = "template"
generator = "extractive"
evaluator = "deterministic"
telemetry = "memory"

[limits]
max_assets = 32
max_bytes_per_asset = 1048576
max_documents = 32
max_parts_per_document = 256
max_chunks = 1024
chunk_chars = 600
embedding_dimension = 128
top_k = 3
max_context_chars = 2400
max_output_tokens = 160

[settings]
persistence_path = "/var/lib/ragkit/index.sqlite3"
collection_name = "ragkit"
device = "cpu"
