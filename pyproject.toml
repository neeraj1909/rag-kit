[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "rag-kit"
version = "0.1.0"
description = "Modular, provenance-complete retrieval foundations for five document families"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
authors = [{ name = "rag-kit contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = []

[project.scripts]
ragkit = "ragkit.cli.main:main"

[project.optional-dependencies]
text = []
ocr = [
  "pillow>=12,<13",
  "pypdfium2>=4.30,<5",
  "pytesseract>=0.3.13,<0.4",
]
layout = [
  "openpyxl>=3.1,<4",
  "pdfplumber>=0.11,<0.12",
  "python-pptx>=1.0,<2",
]
vision = [
  "pillow>=12,<13",
  "torch>=2.7,<3",
  "torchvision>=0.22,<1",
  "transformers>=4.57,<6",
]
media = [
  "faster-whisper>=1.2,<2",
  "scenedetect[opencv]>=0.6.7,<0.7",
]
persistent = ["chromadb>=1,<2"]
hosted = ["openai>=2,<3"]
reranking = [
  "torch>=2.7,<3",
  "transformers>=4.57,<6",
]

[dependency-groups]
dev = [
  "build>=1.3,<2",
  "mypy>=1.18,<2",
  "pytest>=8.4,<10",
  "pytest-cov>=7,<8",
  "pytest-socket>=0.7,<0.8",
  "ruff>=0.12,<0.16",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ragkit"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
show_error_codes = true
warn_unreachable = true

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "--disable-socket"]
testpaths = ["tests"]
markers = [
  "unit: deterministic isolated tests",
  "contract: reusable behavioral adapter contracts",
  "integration: local SDK or storage integration tests",
  "modality_integration: bounded representative family integration tests",
  "e2e: user-visible end-to-end journeys",
  "live: opt-in credentialed or paid provider checks",
]

[tool.coverage.run]
branch = true
source = ["ragkit"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.uv]
default-groups = ["dev"]
