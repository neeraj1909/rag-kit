[profile]
name = "vision-equipment"
family = "vision"
source = "tests/fixtures/vision/equipment.png"

[components]
connector = "filesystem"
classifier = "declared"
extractor = "vision"
projector = "noop"
chunker = "adaptive"
embedder = "hashing"
vector_store = "memory"
retriever = "dense"
reranker = "noop"
prompt_builder = "template"
generator = "extractive"
evaluator = "deterministic"
telemetry = "memory"

[limits]
max_assets = 4
max_bytes_per_asset = 10485760
max_documents = 4
max_parts_per_document = 256
max_chunks = 1024
chunk_chars = 600
embedding_dimension = 128
top_k = 3
max_context_chars = 2400
max_output_tokens = 160

[settings]
vision_image_longest_edge = 64
vision_max_new_tokens = 4
vision_timeout_seconds = 60.0
