[profile]
name = "hosted"
family = "text"
source = "tests/fixtures/corpus"

[components]
connector = "filesystem"
classifier = "text"
extractor = "text"
projector = "noop"
chunker = "structure_aware"
embedder = "hashing"
vector_store = "memory"
reranker = "noop"
prompt_builder = "template"
generator = "openai"
evaluator = "deterministic"
telemetry = "memory"

[limits]
max_assets = 32
max_bytes_per_asset = 1048576
max_documents = 32
max_parts_per_document = 256
max_chunks = 1024
chunk_chars = 600
embedding_dimension = 128
top_k = 3
max_context_chars = 2400
max_output_tokens = 160

[settings]
hosted_model = "gpt-5-mini"
credential_env = "OPENAI_API_KEY"
timeout_seconds = 30.0
max_retries = 2
