[profile]
name = "ocr-claims"
family = "ocr"
source = "tests/fixtures/ocr/printed-claim.png"

[components]
connector = "filesystem"
classifier = "declared"
extractor = "ocr"
projector = "noop"
chunker = "adaptive"
embedder = "hashing"
vector_store = "memory"
retriever = "dense"
reranker = "noop"
prompt_builder = "template"
generator = "extractive"
evaluator = "deterministic"
telemetry = "memory"

[limits]
max_assets = 4
max_bytes_per_asset = 10485760
max_documents = 4
max_parts_per_document = 4096
max_chunks = 4096
chunk_chars = 600
embedding_dimension = 128
top_k = 3
max_context_chars = 2400
max_output_tokens = 160

[settings]
ocr_language = "eng"
ocr_content_mode = "form"
