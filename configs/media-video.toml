[profile]
name = "media-video-training"
family = "media"
source = "tests/fixtures/media/training.mp4"

[components]
connector = "filesystem"
classifier = "declared"
extractor = "media"
projector = "noop"
chunker = "evidence"
embedder = "hashing"
vector_store = "memory"
retriever = "dense"
reranker = "noop"
prompt_builder = "template"
generator = "extractive"
evaluator = "deterministic"
telemetry = "memory"

[limits]
max_assets = 1
max_bytes_per_asset = 104857600
max_documents = 1
max_parts_per_document = 1024
max_chunks = 4096
chunk_chars = 600
embedding_dimension = 128
top_k = 5
max_context_chars = 2400
max_output_tokens = 160
