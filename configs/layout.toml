[profile]
name = "layout-pricing"
family = "layout"
source = "tests/fixtures/layout/pricing.xlsx"

[components]
connector = "filesystem"
classifier = "declared"
extractor = "layout"
projector = "noop"
chunker = "evidence"
embedder = "hashing"
vector_store = "memory"
retriever = "dense"
reranker = "noop"
prompt_builder = "template"
generator = "extractive"
evaluator = "deterministic"
telemetry = "memory"

[limits]
max_assets = 4
max_bytes_per_asset = 10485760
max_documents = 4
max_parts_per_document = 100000
max_chunks = 100000
chunk_chars = 600
embedding_dimension = 128
top_k = 3
max_context_chars = 2400
max_output_tokens = 160
